[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"

# На сервисе miniapp: BACKEND_URL=https://api.prompt-bank.one (см. docs/DOMAIN.md).
# BACKEND_URL подставляется в dist/config.js при старте (write-runtime-config.mjs).
